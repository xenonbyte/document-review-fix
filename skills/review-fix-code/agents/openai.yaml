# Copied verbatim into every generated Codex skill as `<skill>/agents/openai.yaml`,
# and kept byte-identical in each `skills/review-fix-*/agents/` source descriptor.
#
# Codex treats `policy.allow_implicit_invocation` as `true` when the key is absent, so
# `drfx install` validates this file with `lib/yaml-block-mapping.js` and refuses to
# install when the setting is missing or permissive.
#
# The parser accepts only a narrow YAML block-mapping subset. The install validator
# then requires the exact generated schema: one top-level `policy` mapping containing
# only the plain `allow_implicit_invocation: false` scalar. Extend both validators
# before adding fields such as `interface`, `dependencies`, or `policy.products`;
# unsupported or malformed metadata must fail the install instead of restoring Codex
# defaults.
policy:
  allow_implicit_invocation: false
